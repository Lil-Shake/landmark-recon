// ---------- smooth camera flights (Tween-style, no library) ----------

document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { exitCompare(); flyTo(viewPose(b.dataset.view)); });

function setSun(v) { // v 0..100 : dawn (east, low, warm) -> noon -> dusk (west, low, warm)

  const texP = new THREE.TextureLoader().loadAsync(base + "albedo.jpg");
  const [b64, camsData, tex] = await Promise.all([(lm.parts > 1 ? (async () => { let all = ""; for (let i = 0; i < lm.parts; i++) all += await fetchText(base + `geom.glb.b64.${i}.txt`, p => loading(`正在加载 ${lm.title}…`, 0.05 + 0.85 * (i + p) / lm.parts)); return all; })()
                   : fetchText(base + "geom.glb.b64.txt", p => loading(`正在加载 ${lm.title}…`, 0.05 + 0.85 * p))), fetch(base + "cameras_web.json").then(r => r.json()), texP]);
  if (token !== loadToken) { tex.dispose(); return; }
  tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const bin = atob(b64.trim()), buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const g = await new GLTFLoader().parseAsync(buf.buffer, ""); if (token !== loadToken) { tex.dispose(); return; }
  g.scene.traverse(o => { if (o.isMesh && !mesh) mesh = o; });
  const geo = mesh.geometry; geo.computeVertexNormals(); geo.computeBoundingSphere();
  const ev = geo.getAttribute("_evidence") || geo.getAttribute("_EVIDENCE"), fl = geo.getAttribute("_filled") || geo.getAttribute("_FILLED");
  const n = geo.attributes.position.count, col = new Float32Array(n * 3); let zero = 0;
  const c0 = new THREE.Color(0xe8742a), c1 = new THREE.Color(0xe2b33c), cF = new THREE.Color(0x9b6bd6), c3 = new THREE.Color(0xffffff);
  for (let i = 0; i < n; i++) { const e = ev ? ev.getX(i) : 3; const c = (fl && fl.getX(i) > 0.5 && e < 0.5) ? cF : e < 0.5 ? c0 : e < 3 ? c1 : c3; if (e < 0.5) zero++; col.set([c.r, c.g, c.b], i * 3); }
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  mats.photo = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
  mats.clay = new THREE.MeshStandardMaterial({ color: 0xc8beb2, roughness: 0.93, side: THREE.DoubleSide });
  mats.evidence = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, side: THREE.DoubleSide });
  mesh.material = mats[mode]; mesh.castShadow = mesh.receiveShadow = true; root = g.scene; scene.add(root);
  box.setFromObject(root); box.getSize(size); box.getCenter(center); R = Math.max(size.x, size.y, size.z);
  persp.near = Math.max(0.05, R / 3000); persp.far = R * 60; persp.updateProjectionMatrix();
  scene.fog = new THREE.Fog(new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--sky-mid").trim() || "#6b5a4e"), R * 3, R * 12);
  setSun(+$("tod").value);
  $("dims").innerHTML = `<div><span>宽 X</span><span>${size.x.toFixed(1)} m</span></div><div><span>高 Y</span><span>${size.y.toFixed(1)} m</span></div><div><span>深 Z</span><span>${size.z.toFixed(1)} m</span></div>
    <div><span>三角面</span><span>${(geo.index.count / 3 / 1000).toFixed(0)} k</span></div><div><span>无证据顶点</span><span>${(zero / n * 100).toFixed(1)}%</span></div>`;
  camsList = camsData.cameras; atlasInfo = camsData.thumb_atlas || null;
  $("striplbl").textContent = `真实照片 ${camsList.length} 张${lm.registered && lm.registered > camsList.length ? `（共注册 ${lm.registered} 张，按机位分布挑选）` : ""} · 点一张，镜头飞到它的拍摄位置`;
  buildStrip(); buildHots(lm.annotations || []); buildHuman(lm.human_at);
  loading(""); layout();
  // intro: from far and high, ease into the front view (model-viewer / Voyager style)
  const front = viewPose("front"); cam.position.copy(center).add(new THREE.Vector3(R * 1.6, R * 1.1, R * 3.2)); controls.target.copy(center); cam.lookAt(center);
  flyTo(front, 2600, () => { const h = $("hint"); h.hidden = false; h.style.opacity = 1; setTimeout(() => { h.style.opacity = 0; setTimeout(() => h.hidden = true, 700); }, 2800); });
}

// ---------- surface hit helpers ----------
function surfaceAt(xy, from = "front") {   // annotation anchors are given as model x,y; find the surface by casting from the front
  const o = new THREE.Vector3(xy[0], xy[1], box.max.z + R), d = new THREE.Vector3(0, 0, -1);
  if (from === "down") { o.set(xy[0], box.max.y + R, xy[1]); d.set(0, -1, 0); }
  ray.set(o, d); const h = ray.intersectObject(mesh)[0]; return h ? { p: h.point, n: h.face.normal.clone().transformDirection(mesh.matrixWorld) } : null;
}

// ---------- annotations (hotspots) + guided tour ----------
let hots = [], tourIdx = -1;
function buildHots(list) {
  const host = $("hots");
  list.forEach((a, i) => { const s = a.at ? surfaceAt(a.at, a.from) : null; if (!s) return;
    const el = document.createElement("div"); el.className = "hot"; el.innerHTML = `<span class="dot"></span><span class="tag">${esc(a.title)}</span>`;
    el.onclick = () => { stopTour(false); showStop(hots.indexOf(h)); }; host.appendChild(el);
    const h = { ...a, p: s.p, n: s.n, el }; hots.push(h); });
  $("tour").hidden = hots.length === 0; $("hotsbtn").hidden = hots.length === 0;
  $("dots").innerHTML = hots.map(() => "<i></i>").join("");
}
function stopPose(h) {   // look at the anchor mostly from the front (viewers' side), a little from above and along the surface normal
  const n = h.n.clone(); n.y = 0; const dir = new THREE.Vector3(0, 0.22, 1).addScaledVector(n, 0.35).normalize(); const dist = (h.dist || 0.32) * R;
  return { pos: h.p.clone().addScaledVector(dir, dist), target: h.p.clone() }; }
function showStop(i) {
  if (i < 0 || i >= hots.length) return; tourIdx = i; const h = hots[i]; exitCompare();
  $("cap").hidden = false; $("capt").textContent = h.title; $("capx").textContent = h.text || "";
  [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i)); flyTo(stopPose(h), 1900);
}
let tourTimer = null;
function startTour() { $("tour").setAttribute("aria-pressed", "true"); $("tour").innerHTML = "停止导览<kbd>T</kbd>"; let i = 0; showStop(i);
  tourTimer = setInterval(() => { i++; if (i >= hots.length) { stopTour(); flyTo(viewPose("front"), 2200); return; } showStop(i); }, reduce ? 9000 : 6500); }
function stopTour(hide = true) { clearInterval(tourTimer); tourTimer = null; $("tour").setAttribute("aria-pressed", "false"); $("tour").innerHTML = "▶ 开始导览<kbd>T</kbd>"; if (hide) $("cap").hidden = true; }
$("tour").onclick = () => tourTimer ? stopTour() : startTour();
$("next").onclick = () => { stopTour(false); showStop((tourIdx + 1) % hots.length); };
$("prev").onclick = () => { stopTour(false); showStop((tourIdx - 1 + hots.length) % hots.length); };
$("stop").onclick = () => { stopTour(); flyTo(viewPose("front")); };
$("hotsbtn").onclick = () => { const on = $("hotsbtn").getAttribute("aria-pressed") !== "true"; $("hotsbtn").setAttribute("aria-pressed", on); $("hots").hidden = !on; };
let occFrame = 0;
function placeHots() {
  if (!hots.length || $("hots").hidden) return; const r = canvas.getBoundingClientRect(), s = stage.getBoundingClientRect(); occFrame++;
  for (const h of hots) {
    const v = h.p.clone().project(cam); const vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && !compare;
    h.el.hidden = !vis; if (!vis) continue;
    h.el.style.left = (r.left - s.left + (v.x + 1) / 2 * r.width) + "px"; h.el.style.top = (r.top - s.top + (1 - v.y) / 2 * r.height) + "px";
    if (occFrame % 12 === 0) { // fade when the anchor faces away or is hidden (model-viewer behaviour)
      const toCam = cam.position.clone().sub(h.p).normalize(); let dim = h.n.dot(toCam) < 0.05;
      if (!dim) { ray.set(h.p.clone().addScaledVector(toCam, R * 0.004), toCam); const hit = ray.intersectObject(mesh)[0]; dim = !!hit && hit.distance < cam.position.distanceTo(h.p) * 0.97; }
      h.el.classList.toggle("dim", dim); }
  }
}

// ---------- photo constellation: every registered camera as a little frustum with its photo ----------
const texCache = new Map();
function atlasTex(cb) { const key = base + atlasInfo.file; let e = texCache.get(key);
  if (!e) { e = { t: null, q: [] }; texCache.set(key, e); new THREE.TextureLoader().load(key, t => { t.colorSpace = THREE.SRGBColorSpace; e.t = t; e.q.forEach(f => f(t)); e.q = []; }); }
  if (e.t) cb(e.t); else e.q.push(cb); }
function thumbHTML(c, H = 56) { // <img> for per-file thumbs, a cropped atlas cell otherwise
  if (!(atlasInfo && c.atlas)) return `<img src="${base}thumbs/${c.id}.jpg" alt="照片 ${esc(c.id)}" loading="lazy">`;
  const [x, y, w, h] = c.atlas, k = H / h, A = atlasInfo;
  return `<span role="img" aria-label="照片 ${esc(c.id)}" style="display:block;width:${Math.round(w * k)}px;height:${H}px;background:url('${base}${A.file}') -${x * k}px -${y * k}px / ${A.w * k}px ${A.h * k}px no-repeat"></span>`; }
function buildConstellation() {
  consG.clear(); const tl = new THREE.TextureLoader(); const sz = R * 0.06;
  camsList.forEach(c => {
    const q = new THREE.Quaternion(...c.quaternion), h = sz, w = h * c.aspect, d = sz * 1.6;
    const pts = [[-w, -h], [w, -h], [w, h], [-w, h]].map(([x, y]) => new THREE.Vector3(x / 2, y / 2, -d));
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), pts[0], new THREE.Vector3(), pts[1], new THREE.Vector3(), pts[2], new THREE.Vector3(), pts[3], pts[0], pts[1], pts[1], pts[2], pts[2], pts[3], pts[3], pts[0]]);
    const fr = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffc89a, transparent: true, opacity: 0.85, fog: false }));
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, fog: false, transparent: true, opacity: 0.95 }));
    plane.position.z = -d; const grp = new THREE.Group(); grp.add(fr, plane); grp.position.set(...c.position); grp.quaternion.copy(q); grp.userData.cam = c; consG.add(grp);
    if (atlasInfo && c.atlas) { // one sprite atlas per landmark; each frustum shows its own cell
      const [x, y, w, hh] = c.atlas, A = atlasInfo; atlasTex(t0 => { const t = t0.clone(); t.repeat.set(w / A.w, hh / A.h); t.offset.set(x / A.w, 1 - (y + hh) / A.h); t.needsUpdate = true;
        plane.material.map = t; plane.material.needsUpdate = true; });
    } else tl.load(`${base}thumbs/${c.id}.jpg`, t => { t.colorSpace = THREE.SRGBColorSpace; plane.material.map = t; plane.material.needsUpdate = true; });
  });
}
$("cons").onclick = () => { const on = $("cons").getAttribute("aria-pressed") !== "true"; $("cons").setAttribute("aria-pressed", on);
  if (on && !consG.children.length) buildConstellation(); consG.visible = on;
  if (on) { // frame the model plus the nearest 90% of cameras (a few far river/telephoto shots would shrink everything)
    const ds = camsList.map(c => new THREE.Vector3(...c.position).distanceTo(center)).sort((a, b) => a - b); const r90 = ds[Math.floor(ds.length * 0.9)] || R;
    const rad = Math.max(r90, R * 0.8); flyTo({ pos: center.clone().add(new THREE.Vector3(rad * 0.55, rad * 0.75, rad * 1.25)), target: center.clone() }, 2200); } };

// ---------- 1.7 m person for scale ----------
function buildHuman(at) {
  // at = [x, z] (ray down to the floor) or [x, z, y] (explicit ground height, for crops that cut the floor away)
  humanG.clear(); const s = at && at.length === 3 ? { p: new THREE.Vector3(at[0], at[2], at[1]) } : at ? surfaceAt(at, "down") : surfaceAt([center.x, box.max.z - size.z * 0.15], "down"); if (!s) return;
  const mat = new THREE.MeshStandardMaterial({ color: 0x1e90ff, emissive: 0x0a3d7a, roughness: 0.5 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.05, 6, 12), mat); body.position.y = 0.75;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), mat); head.position.y = 1.57;
  humanG.add(body, head); humanG.position.copy(s.p); humanG.visible = false;
}
$("human").onclick = () => { const on = $("human").getAttribute("aria-pressed") !== "true"; $("human").setAttribute("aria-pressed", on); humanG.visible = on; $("hlabel").hidden = !on;
  // low camera a few metres in front of the person, looking up: person in the foreground, the monument towering behind
  if (on) { const p = humanG.position.clone(); flyTo({ pos: p.clone().add(new THREE.Vector3(3, 2.2, 16)), target: p.clone().add(new THREE.Vector3(0, 7, -12)) }, 2000); } };
function placeHuman() { const el = $("hlabel"); if (el.hidden || !humanG.children.length) return;
  const v = humanG.position.clone().add(new THREE.Vector3(0, 2.0, 0)).project(cam); const r = canvas.getBoundingClientRect(), s = stage.getBoundingClientRect();
  el.style.left = (r.left - s.left + (v.x + 1) / 2 * r.width) + "px"; el.style.top = (r.top - s.top + (1 - v.y) / 2 * r.height) + "px"; el.style.opacity = v.z < 1 ? 1 : 0; }

// ---------- compare with a real photo (fly to its pose, then wipe) ----------
function buildStrip() {
  const t = $("thumbs");
  camsList.forEach(c => { const b = document.createElement("button"); b.setAttribute("aria-pressed", "false"); b.title = c.id;
    b.innerHTML = thumbHTML(c); b.onclick = () => enterCompare(c, b); t.appendChild(b); });
}
function enterCompare(c, btn) {
  stopTour(); if (cam !== persp) $("ortho").click();
  document.querySelectorAll(".thumbs button").forEach(b => b.setAttribute("aria-pressed", b === btn));
  const s = c.source || {};
  $("credit").innerHTML = `照片 ${esc(c.id)}：${esc(s.artist || "作者不详")} · ${esc(s.license || "")}${s.page ? ` · <a href="${esc(s.page)}" target="_blank" rel="noopener">原页面</a>` : ""}`;
  flyTo({ pos: new THREE.Vector3(...c.position), quat: new THREE.Quaternion(...c.quaternion), fov: c.fov_y }, 1800, () => {
    compare = c; controls.enabled = false; photo.src = `${base}photos/${c.id}.jpg`; photo.style.display = "block"; wbar.style.display = "block";
    $("chipL").hidden = $("chipR").hidden = false; $("cmpctl").hidden = false; $("wipe").value = 50; layout(); });
}
function exitCompare() {
  if (!compare) return; compare = null; controls.enabled = true; persp.fov = 42; persp.updateProjectionMatrix();
  photo.style.display = "none"; wbar.style.display = "none"; $("chipL").hidden = $("chipR").hidden = true; $("cmpctl").hidden = true;
  document.querySelectorAll(".thumbs button").forEach(b => b.setAttribute("aria-pressed", "false")); controls.target.copy(center); controls.update(); layout();
}
$("exitcmp").onclick = () => { exitCompare(); flyTo(viewPose("front")); };
function wipe() { if (!compare) return; const v = +$("wipe").value; photo.style.clipPath = `inset(0 ${100 - v}% 0 0)`;
  const r = canvas.getBoundingClientRect(), s = stage.getBoundingClientRect(); Object.assign(wbar.style, { left: (r.left - s.left + r.width * v / 100) + "px", top: (r.top - s.top) + "px", height: r.height + "px" }); }
$("wipe").addEventListener("input", wipe);

// ---------- measuring + clicking a frustum ----------
let measuring = false, pending = null, nm = 0, down = null;
$("mbtn").onclick = () => { measuring = !measuring; $("mbtn").setAttribute("aria-pressed", measuring); pending = null; };
$("clr").onclick = () => { marks.clear(); $("meas").innerHTML = ""; pending = null; nm = 0; };
canvas.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
canvas.addEventListener("pointerup", e => {
  if (!mesh || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = canvas.getBoundingClientRect(); ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), cam);
  if (consG.visible && consG.children.length && !measuring) { const hc = ray.intersectObjects(consG.children, true)[0];
    if (hc) { let o = hc.object; while (o && !o.userData.cam) o = o.parent; if (o) { const c = o.userData.cam; enterCompare(c, [...document.querySelectorAll(".thumbs button")].find(b => b.title === c.id)); return; } } }
  if (!measuring) return; const hit = ray.intersectObject(mesh)[0]; if (!hit) return;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(R / 300), new THREE.MeshBasicMaterial({ color: 0xff6a2a, depthTest: false, fog: false })); dot.renderOrder = 9; dot.position.copy(hit.point); marks.add(dot);
  if (!pending) { pending = hit.point.clone(); return; }
  const a = pending, b = hit.point.clone(); pending = null; nm++;
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), new THREE.LineBasicMaterial({ color: 0xff6a2a, depthTest: false, fog: false })); ln.renderOrder = 9; marks.add(ln);
  const d = b.clone().sub(a); $("meas").insertAdjacentHTML("beforeend", `<div>#${nm} ${d.length().toFixed(2)} m<small>Δx ${Math.abs(d.x).toFixed(2)} · Δy ${Math.abs(d.y).toFixed(2)} · Δz ${Math.abs(d.z).toFixed(2)}</small></div>`);
});
addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; const k = e.key.toLowerCase();
  if (k === "1" || k === "2" || k === "3") setMode(["photo", "clay", "evidence"][+k - 1]); else if (k === "t") $("tour").click(); else if (k === "c") $("cons").click(); else if (k === "m") $("mbtn").click();
  else if (k === "escape") { stopTour(); exitCompare(); } });

renderer.setAnimationLoop(now => { stepFlight(now); if (controls.enabled) controls.update(); placeHots(); placeHuman(); renderer.render(scene, cam); });

fetch("manifest.json").then(r => r.json()).then(list => {
  list.forEach(lm => { const b = document.createElement("button"); b.className = "tab"; b.setAttribute("role", "tab"); b.dataset.id = lm.id;
    b.innerHTML = `${esc(lm.title)}<small>${esc(lm.badge || "")}</small>`; b.onclick = () => load(lm).catch(e => loading("加载失败：" + e.message, 0)); $("tabs").appendChild(b); });
  const want = location.hash.slice(1); const first = list.find(l => l.id === want) || list[0]; if (first) load(first).catch(e => loading("加载失败：" + e.message, 0));
}).catch(e => loading("读取地标列表失败：" + e.message, 0));
window.__gallery = { get loaded() { return !!mesh && $("loader").hidden && !flight; }, get size() { return size; }, get hots() { return hots.length; } };
</script>

</body></html>
